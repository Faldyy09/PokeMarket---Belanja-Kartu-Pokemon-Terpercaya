<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMarket Indonesia - Pusat TCG & Kartu Pokémon Terlengkap</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        
        /* Header / Navbar Glassmorphism */
        header { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px);
            color: white; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #334155; 
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo img { height: 45px; width: auto; transition: transform 0.3s; }
        .logo img:hover { transform: scale(1.05); }
        
        nav a { 
            color: #cbd5e1; 
            text-decoration: none; 
            margin-left: 20px; 
            font-weight: 500; 
            transition: color 0.2s;
            padding: 6px 12px;
            border-radius: 8px;
        }
        nav a:hover, nav a.aktif { 
            color: #ffcc00; 
            background: rgba(255, 204, 0, 0.1);
            text-shadow: 0 0 10px rgba(255,204,0,0.5); 
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        /* Hero Banner Section */
        .hero-section {
            position: relative;
            max-width: 1200px;
            margin: 30px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-banner {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            display: block;
            filter: brightness(0.85);
        }
        .hero-text {
            position: absolute;
            bottom: 30px;
            left: 40px;
            background: rgba(15, 23, 42, 0.9);
            padding: 20px 30px;
            border-radius: 12px;
            border-left: 6px solid #cc0000;
            max-width: 600px;
        }
        .hero-text h1 { margin: 0 0 8px 0; font-size: 28px; color: #ffcc00; }
        .hero-text p { margin: 0; font-size: 14px; color: #cbd5e1; line-height: 1.5; }

        /* Judul Section Umum */
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 60px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid #cc0000;
            padding-left: 15px;
        }
        .section-title span { color: #ffcc00; }

        /* Sub-kategori Katalog */
        .kategori-title {
            font-size: 18px;
            color: #ffcc00;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            font-weight: 600;
        }

        /* Grid Produk */
        .katalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card-produk {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            text-align: center;
            padding: 18px;
        }

        .card-produk:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(204,0,0,0.4);
            border-color: #ffcc00;
        }

        .card-produk img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            background: #0f172a;
            padding: 8px;
        }

        .img-source-link {
            display: block;
            font-size: 11px;
            color: #38bdf8;
            text-decoration: none;
            margin: 6px 0;
            word-break: break-all;
        }
        .img-source-link:hover {
            text-decoration: underline;
            color: #7dd3fc;
        }

        .kategori-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            background-color: #3b4cca;
            color: #ffcc00;
            padding: 4px 10px;
            border-radius: 20px;
            margin: 6px 0 4px 0;
            text-transform: uppercase;
        }

        .card-produk h3 { font-size: 15px; margin: 8px 0 6px 0; color: #f8fafc; }
        .card-produk .harga { font-weight: 700; color: #ff4d4d; font-size: 16px; margin-bottom: 8px; }

        .btn-detail {
            background-color: #ffcc00;
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-detail:hover { background-color: #e6b800; }

        /* Section Pemesanan Wrapper */
        .order-section-wrapper {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 35px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 6px solid #cc0000;
        }

        .steps { 
            background: #0f172a; 
            border: 2px dashed #ffcc00; 
            padding: 20px 25px; 
            margin-bottom: 30px; 
            border-radius: 12px; 
        }
        .steps h3 { margin-top: 0; color: #ffcc00; font-size: 18px; }
        .steps ol { margin: 0; padding-left: 20px; line-height: 1.8; color: #cbd5e1; }
        .steps li::marker { color: #ffcc00; font-weight: bold
